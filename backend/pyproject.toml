[project]
name = "qsign"
version = "0.4.0"
license = "LicenseRef-QSign-Commercial"
description = "Quantum-safe hybrid (ML-DSA + ECDSA) electronic signatures on AWS"
requires-python = ">=3.11"
dependencies = ["cryptography>=48.0.0", "fastapi>=0.115", "mangum>=0.19", "boto3>=1.40"]

[project.scripts]
qsign = "qsign.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qsign"]

[tool.setuptools.package-data]
qsign = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
