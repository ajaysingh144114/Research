name: CI
on:
  push:
  pull_request:
jobs:
  phishguard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phishguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .[dev]
      - run: pytest -q
