AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  QSign - quantum-safe hybrid e-signatures. ML-DSA-65 + ECDSA P-384 keys in AWS KMS,
  Cognito sign-in, write-once (Object Lock) archive in S3 and an audit table in DynamoDB.

Parameters:
  ArchiveRetentionDays:
    Type: Number
    Default: 3650
    MinValue: 1
    Description: Days each signature bundle stays locked (cannot be deleted or changed). 3650 = 10 years.
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Browser origin allowed to call the API (set to your own domain in production).
  SesSenderEmail:
    Type: String
    Default: ""
    Description: Verified Amazon SES sender (e.g. sign@yourcompany.com) for "please sign" emails. Empty = no emails.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Email that receives operational alarms. Empty = alarms without email.
  AppUrl:
    Type: String
    Default: ""
    Description: Public URL of QSign (custom domain) used in email links. Empty = the API Gateway URL.
  LogRetentionDays:
    Type: Number
    Default: 365
    AllowedValues: [30, 90, 180, 365, 731, 1827, 3653]

Conditions:
  HasSesSender: !Not [!Equals [!Ref SesSenderEmail, ""]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Timeout: 15
    MemorySize: 512
    Tracing: Active

Resources:
  # ---------- Signing keys (private keys never leave KMS HSMs) ----------
  MlDsaKey:
    Type: AWS::KMS::Key
    Properties:
      Description: QSign post-quantum signing key (ML-DSA-65, NIST FIPS 204)
      KeySpec: ML_DSA_65
      KeyUsage: SIGN_VERIFY
      EnableKeyRotation: false
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"

  MlDsaKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/qsign-${AWS::StackName}-mldsa65"
      TargetKeyId: !Ref MlDsaKey

  EcdsaKey:
    Type: AWS::KMS::Key
    Properties:
      Description: QSign classical signing key (ECDSA P-384), paired with ML-DSA
      KeySpec: ECC_NIST_P384
      KeyUsage: SIGN_VERIFY
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"

  EcdsaKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/qsign-${AWS::StackName}-ecdsa-p384"
      TargetKeyId: !Ref EcdsaKey

  # ---------- Signer accounts ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "qsign-${AWS::StackName}"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: "ON"
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      DeletionProtection: ACTIVE
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        UnusedAccountValidityDays: 7
        InviteMessageTemplate:
          EmailSubject: Your QSign e-signature account
          EmailMessage: >-
            You have been invited to QSign to review and sign documents.
            Your username is {username} and your temporary password is {####}.
            You will choose a new password and set up an authenticator app when you first sign in.
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: email
          Required: true
          Mutable: false
        - Name: name
          Required: false
          Mutable: true
        - Name: org_id
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints: { MinLength: "1", MaxLength: "64" }

  OrgAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: org-admin
      Description: Organisation administrators (invite users, read the audit trail)

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: qsign-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      ReadAttributes: [email, email_verified, name, "custom:org_id"]
      WriteAttributes: [name]
      IdTokenValidity: 15
      TokenValidityUnits: { IdToken: minutes }

  # ---------- Tamper-evident records ----------
  AuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: org_id, AttributeType: S }
        - { AttributeName: at, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: by_org
          KeySchema:
            - { AttributeName: org_id, KeyType: HASH }
            - { AttributeName: at, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
      DeletionProtectionEnabled: true

  EnvelopeTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
      DeletionProtectionEnabled: true

  ArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Days: !Ref ArchiveRetentionDays
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  ArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArchiveBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArchiveBucket.Arn
              - !Sub "${ArchiveBucket.Arn}/*"
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # ---------- API ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type, authorization]
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref UserPoolClient]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","time":"$context.requestTime","method":"$context.httpMethod","route":"$context.routeKey","status":"$context.status","latencyMs":"$context.responseLatency","user":"$context.authorizer.claims.email","error":"$context.integrationErrorMessage"}'

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  ApiFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: !Ref LogRetentionDays

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: qsign.lambda_handler.handler
      Environment:
        Variables:
          QSIGN_MODE: kms
          QSIGN_KMS_MLDSA_KEY_ID: !GetAtt MlDsaKey.Arn
          QSIGN_KMS_ECDSA_KEY_ID: !GetAtt EcdsaKey.Arn
          QSIGN_AUDIT_TABLE: !Ref AuditTable
          QSIGN_ARCHIVE_BUCKET: !Ref ArchiveBucket
          QSIGN_COGNITO_CLIENT_ID: !Ref UserPoolClient
          QSIGN_USER_POOL_ID: !Ref UserPool
          QSIGN_ENVELOPE_TABLE: !Ref EnvelopeTable
          QSIGN_AUTO_INVITE_SIGNERS: "1"
          QSIGN_SES_SENDER: !Ref SesSenderEmail
          QSIGN_APP_URL: !Ref AppUrl
          QSIGN_RETIRED_KEY_FINGERPRINTS: ""
      Policies:
        - Statement:
            - Effect: Allow
              Action: [kms:Sign, kms:GetPublicKey]
              Resource: [!GetAtt MlDsaKey.Arn, !GetAtt EcdsaKey.Arn]
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:Query]
              Resource: [!GetAtt AuditTable.Arn, !Sub "${AuditTable.Arn}/index/by_org"]
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:BatchGetItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt EnvelopeTable.Arn
            - Effect: Allow
              Action: [s3:PutObject]
              Resource: !Sub "${ArchiveBucket.Arn}/archive/*"
            - Effect: Allow
              Action: [cognito-idp:AdminCreateUser, cognito-idp:AdminGetUser, cognito-idp:AdminAddUserToGroup]
              Resource: !GetAtt UserPool.Arn
            - !If
              - HasSesSender
              - Effect: Allow
                Action: [ses:SendEmail]
                Resource: "*"
                Condition: { StringEquals: { "ses:FromAddress": !Ref SesSenderEmail } }
              - !Ref AWS::NoValue
      Events:
        # Public routes: the web app, health, published keys and verification.
        Index:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /, Method: GET }
        Health:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /health, Method: GET }
        Config:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /api/config, Method: GET }
        Keys:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /api/keys, Method: GET }
        Verify:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /api/verify, Method: POST }
        # Everything else under /api needs a signed-in user (secure by default).
        Private:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: ANY
            Auth: { Authorizer: CognitoJwt }

  # ---------- Monitoring ----------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: QSign Lambda errors (signing may be failing)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  FunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: QSign Lambda is being throttled
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: QSign API is returning server errors
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{ Name: ApiId, Value: !Ref HttpApi }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  AppUrl:
    Description: Open this in a browser to sign and verify documents
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/"
  UserPoolId:
    Description: Add signers here (Cognito > Users > Create user)
    Value: !Ref UserPool
  MlDsaKeyArn:
    Value: !GetAtt MlDsaKey.Arn
  EcdsaKeyArn:
    Value: !GetAtt EcdsaKey.Arn
  AuditTableName:
    Value: !Ref AuditTable
  EnvelopeTableName:
    Value: !Ref EnvelopeTable
  AlarmTopicArn:
    Value: !Ref AlarmTopic
  ArchiveBucketName:
    Value: !Ref ArchiveBucket
